name: Check published Action pins
description: Run the published version and commit through the runner and verify their outputs.
runs:
  using: composite
  steps:
    - name: Write version selection file
      shell: bash
      env: { EXPECTED_TAG: RELEASE_TAG }
      run: echo "actionlint ${EXPECTED_TAG#v}" > .test-tool-versions
    - id: install
      uses: OWNER/REPO@RELEASE_TAG
      env: { ACTIONLINT_ACTION_BINARY: "" }
      with: { version: RELEASE_TAG, install-only: "true", shellcheck: "false", pyflakes: "false" }
    - name: Exercise installed binary from PATH
      shell: bash
      env: { EXPECTED_VERSION: RELEASE_TAG, INSTALLED_VERSION: "${{ steps.install.outputs.version }}" }
      run: |
        test "${INSTALLED_VERSION}" = "${EXPECTED_VERSION#v}"
        actionlint -version | head -1 | grep -F "${EXPECTED_VERSION#v}"
        actionlint check --no-config --shellcheck= --pyflakes= testdata/ok/minimal.yaml
    - id: version_file
      uses: OWNER/REPO@RELEASE_TAG
      env: { ACTIONLINT_ACTION_BINARY: "" }
      with: { version-file: .test-tool-versions, install-only: "true", shellcheck: "false", pyflakes: "false" }
    - name: Verify version file selection
      shell: bash
      env: { EXPECTED_VERSION: RELEASE_TAG, INSTALLED_VERSION: "${{ steps.version_file.outputs.version }}" }
      run: test "${INSTALLED_VERSION}" = "${EXPECTED_VERSION#v}"
    - id: version
      uses: OWNER/REPO@RELEASE_TAG
      env: { ACTIONLINT_ACTION_BINARY: "" }
      with: { files: testdata/ok/minimal.yaml, format: json, shellcheck: "false", pyflakes: "false" }
    - id: commit
      uses: OWNER/REPO@COMMIT_SHA
      env: { ACTIONLINT_ACTION_BINARY: "" }
      with: { files: testdata/ok/minimal.yaml, format: json, shellcheck: "false", pyflakes: "false" }
    - uses: kjanat/actions-shells@697bb547ef1ce427e202b4cbcdb19886aa587da7 # v0.1.0
    - name: Verify version and commit outputs
      shell: actions-shell node {0}
      env:
        VERSION_OUTPUTS: ${{ toJSON(steps.version.outputs) }}
        COMMIT_OUTPUTS: ${{ toJSON(steps.commit.outputs) }}
      run: |
        const assert = require('node:assert/strict');
        for (const name of ['VERSION_OUTPUTS', 'COMMIT_OUTPUTS']) {
          const outputs = JSON.parse(process.env[name]);
          assert.equal(outputs['exit-code'], '0', name);
          assert.equal(outputs.result, 'success', name);
          assert.equal(outputs['problem-count'], '0', name);
          const result = JSON.parse(outputs.output);
          assert.deepEqual(result.diagnostics, [], name);
          assert.partialDeepStrictEqual(result, {
            schema_version: 1,
            status: 'success',
            completed: true,
            exit_code: 0,
            file_count: 1,
          }, name);
        }
